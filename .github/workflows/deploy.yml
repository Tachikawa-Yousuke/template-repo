# GitHub Pages への自動デプロイ
# main ブランチへの push で Astro をビルドし、GitHub Pages に公開します。
# 事前設定: リポジトリの Settings → Pages → Source を「GitHub Actions」にすること。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install, build, and upload site
        uses: withastro/action@v3
        with:
          node-version: 22
        # 秘密情報が必要な場合は env で Secrets から渡す（コードに直書きしない）
        # env:
        #   PUBLIC_MAP_API_KEY: ${{ secrets.PUBLIC_MAP_API_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
